    regles_critiques: "buildUpdateSet"
    statut: "À développer"


# ── Process ──

  - id: ACT-062
    domaine: "Process"
    acteur: "Admin"
    action: "Créer un processus métier"
    http_sql: "POST /processes — INSERT"
    pattern_db: "in-place update"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "tenant_id, lien département"
    statut: "À développer"

  - id: ACT-063
    domaine: "Process"
    acteur: "Admin"
    action: "Modifier un processus"
    http_sql: "PUT /processes/:id"
    pattern_db: "in-place update"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "buildUpdateSet"
    statut: "À développer"


# ── AuditLog ──

  - id: ACT-070
    domaine: "AuditLog"
    acteur: "Système"
    action: "Logger chaque action métier"
    http_sql: "INSERT INTO audit_logs — automatique"
    pattern_db: "append-only"
    agents_responsables: [A23, A06]
    mvp: true
    regles_critiques: "Append-only. Jamais UPDATE/DELETE. Pas de PII en clair"
    statut: "À développer"

  - id: ACT-071
    domaine: "AuditLog"
    acteur: "Auditeur"
    action: "Consulter l'audit trail"
    http_sql: "GET /audit-logs (filtres : user, action, date, tenant)"
    pattern_db: "read-only"
    agents_responsables: [A23]
    mvp: true
    regles_critiques: "tenant_id en filtre obligatoire"
    statut: "À développer"

  - id: ACT-072
    domaine: "AuditLog"
    acteur: "Agent A15"
    action: "Purge RGPD des logs expirés"
    http_sql: "DELETE ciblé sur audit_logs (données expirées)"
    pattern_db: "soft-delete → purge"
    agents_responsables: [A15]
    mvp: false
    regles_critiques: "Approbation HUMAN obligatoire avant purge"
    statut: "À planifier"


# ── Dashboard ──

  - id: ACT-080
    domaine: "Dashboard"
    acteur: "Utilisateur"
    action: "Vue consolidée des risques"
    http_sql: "GET /dashboard/risks"
    pattern_db: "read-only"
    agents_responsables: [A04, A06]
    mvp: true
    regles_critiques: "Motion UI. Filtres tenant"
    statut: "À développer"

  - id: ACT-081
    domaine: "Dashboard"
    acteur: "Utilisateur"
    action: "Vue des anomalies en cours"
    http_sql: "GET /dashboard/anomalies?status=open,in_progress"
    pattern_db: "read-only"
    agents_responsables: [A04, A06]
    mvp: true
    regles_critiques: "Temps réel ou cache court"
    statut: "À développer"

  - id: ACT-082
    domaine: "Dashboard"
    acteur: "Utilisateur"
    action: "Rapport de conformité"
    http_sql: "GET /reports/compliance?framework=BCEAO"
    pattern_db: "read-only"
    agents_responsables: [A14, A06]
    mvp: true
    regles_critiques: "Cadre obligatoire en param"
    statut: "À développer"

  - id: ACT-083
    domaine: "Dashboard"
    acteur: "Utilisateur"
    action: "Export PDF / Excel"
    http_sql: "POST /exports"
    pattern_db: "read-only"
    agents_responsables: [A06, A11]
    mvp: false
    regles_critiques: "Google Drive API ou download direct"
    statut: "À planifier"

  - id: ACT-084
    domaine: "Dashboard"
    acteur: "Utilisateur"
    action: "Importer le logo client"
    http_sql: "POST /settings/branding (multipart image)"
    pattern_db: "in-place update"
    agents_responsables: [A06, A04]
    mvp: true
    regles_critiques: "Image stockée, appliquée au thème"
    statut: "À développer"


# ── Auth ──

  - id: ACT-090
    domaine: "Auth"
    acteur: "Utilisateur"
    action: "Connexion SSO Google"
    http_sql: "OAuth2 Google Identity Services"
    pattern_db: "auth-flow"
    agents_responsables: [A06, A09]
    mvp: true
    regles_critiques: "JWT Google. tenant_id résolu à la connexion"
    statut: "À développer"

  - id: ACT-091
    domaine: "Auth"
    acteur: "Admin"
    action: "Inviter un utilisateur"
    http_sql: "POST /users/invite"
    pattern_db: "in-place update"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "tenant_id hérité de l'organisation"
    statut: "À développer"

  - id: ACT-092
    domaine: "Auth"
    acteur: "Admin"
    action: "Désactiver un utilisateur"
    http_sql: "PATCH /users/:id/disable"
    pattern_db: "soft-delete"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "deleted_at. Sessions révoquées"
    statut: "À développer"

  - id: ACT-093
    domaine: "Auth"
    acteur: "Admin"
    action: "Définir les rôles (RBAC)"
    http_sql: "POST /users/:id/roles"
    pattern_db: "in-place update"
    agents_responsables: [A06, A10]
    mvp: true
    regles_critiques: "Maker-checker : admin ≠ attribueur de ses propres rôles"
    statut: "À développer"


# ── UserManagement ──

  - id: ACT-100
    domaine: "UserManagement"
    acteur: "Admin"
    action: "Créer un compte utilisateur (email, nom, rôle, entité)"
    http_sql: "POST /users — INSERT"
    pattern_db: "in-place update"
    agents_responsables: [A06, A10]
    mvp: true
    regles_critiques: "tenant_id obligatoire ; email unique par tenant ; rôle initial obligatoire"
    statut: "À développer"

  - id: ACT-101
    domaine: "UserManagement"
    acteur: "Admin"
    action: "Modifier le profil utilisateur (nom, fonction, entité)"
    http_sql: "PUT /users/:id — UPDATE"
    pattern_db: "in-place update"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "buildUpdateSet ; tenant_id vérifié"
    statut: "À développer"

  - id: ACT-102
    domaine: "UserManagement"
    acteur: "Admin"
    action: "Suspendre un utilisateur (accès bloqué, données conservées)"
    http_sql: "PATCH /users/:id/suspend"
    pattern_db: "soft-delete"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "deleted_at ; sessions révoquées ; maker-checker si auto-suspension impossible"
    statut: "À développer"

  - id: ACT-103
    domaine: "UserManagement"
    acteur: "Admin"
    action: "Réactiver un utilisateur suspendu"
    http_sql: "PATCH /users/:id/reactivate"
    pattern_db: "in-place update"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "Audit log de réactivation obligatoire"
    statut: "À développer"

  - id: ACT-104
    domaine: "UserManagement"
    acteur: "Utilisateur"
    action: "Consulter son propre profil"
    http_sql: "GET /users/me"
    pattern_db: "read-only"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "Seules ses propres données ; pas de cross-tenant"
    statut: "À développer"

  - id: ACT-105
    domaine: "UserManagement"
    acteur: "Admin"
    action: "Lister les utilisateurs du tenant"
    http_sql: "GET /users?tenant_id=..."
    pattern_db: "read-only"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "tenant_id en filtre obligatoire ; pagination"
    statut: "À développer"

  - id: ACT-106
    domaine: "UserManagement"
    acteur: "Admin"
    action: "Exporter la liste des utilisateurs (Excel / CSV)"
    http_sql: "GET /users/export"
    pattern_db: "read-only"
    agents_responsables: [A06, A11]
    mvp: false
    regles_critiques: "Droits admin + log export"
    statut: "À planifier"

  - id: ACT-107
    domaine: "UserManagement"
    acteur: "Système"
    action: "Révoquer toutes les sessions actives d'un utilisateur"
    http_sql: "DELETE /sessions?user_id=..."
    pattern_db: "soft-delete"
    agents_responsables: [A06, A10]
    mvp: true
    regles_critiques: "Déclenchée automatiquement sur suspension ; JWT invalidation"
    statut: "À développer"


# ── RBAC ──

  - id: ACT-110
    domaine: "RBAC"
    acteur: "Admin"
    action: "Créer un rôle personnalisé (nom, description, permissions)"
    http_sql: "POST /roles — INSERT"
    pattern_db: "in-place update"
    agents_responsables: [A06, A10]
    mvp: true
    regles_critiques: "tenant_id ; pas de doublon de nom ; maker-checker obligatoire"
    statut: "À développer"

  - id: ACT-111
    domaine: "RBAC"
    acteur: "Admin"
    action: "Modifier un rôle existant (description, permissions associées)"
    http_sql: "PUT /roles/:id — UPDATE"
    pattern_db: "in-place update"
    agents_responsables: [A06, A10]
    mvp: true
    regles_critiques: "buildUpdateSet ; audit log obligatoire"
    statut: "À développer"

  - id: ACT-112
    domaine: "RBAC"
    acteur: "Admin"
    action: "Désactiver un rôle (soft-delete, ne pas supprimer)"
    http_sql: "PATCH /roles/:id/disable"
    pattern_db: "soft-delete"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "Vérifier qu'aucun utilisateur actif n'est sur ce rôle avant désactivation"
    statut: "À développer"

  - id: ACT-113
    domaine: "RBAC"
    acteur: "Admin"
    action: "Attribuer un ou plusieurs rôles à un utilisateur"
    http_sql: "POST /users/:id/roles"
    pattern_db: "in-place update"
    agents_responsables: [A06, A10]
    mvp: true
    regles_critiques: "Maker-checker : l'admin ne peut pas s'attribuer ses propres rôles"
    statut: "À développer"

  - id: ACT-114
    domaine: "RBAC"
    acteur: "Admin"
    action: "Retirer un rôle d'un utilisateur"
    http_sql: "DELETE /users/:id/roles/:role_id → soft"
    pattern_db: "soft-delete"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "Audit log ; vérifier qu'il reste au moins un rôle actif"
    statut: "À développer"

  - id: ACT-115
    domaine: "RBAC"
    acteur: "Utilisateur / Admin"
    action: "Consulter les rôles et permissions associés à un compte"
    http_sql: "GET /users/:id/roles"
    pattern_db: "read-only"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "Lecture cross-tenant interdite ; filtre tenant_id"
    statut: "À développer"

  - id: ACT-116
    domaine: "RBAC"
    acteur: "Admin"
    action: "Définir les permissions granulaires (lecture/écriture/validation/admin) par ressource"
    http_sql: "POST /permissions — INSERT"
    pattern_db: "in-place update"
    agents_responsables: [A06, A10]
    mvp: true
    regles_critiques: "Modèle IAM_PERMISSIONS : Type cible (rôle/utilisateur), Ressource, droits boolean"
    statut: "À développer"

  - id: ACT-117
    domaine: "RBAC"
    acteur: "Système"
    action: "Vérifier les droits d'un utilisateur avant chaque action (middleware)"
    http_sql: "Middleware auth — lecture permissions"
    pattern_db: "read-only"
    agents_responsables: [A06, A10]
    mvp: true
    regles_critiques: "tenant_id + rôle + ressource → autorisé/refusé ; 403 si refus"
    statut: "À développer"

  - id: ACT-118
    domaine: "RBAC"
    acteur: "Admin"
    action: "Consulter la matrice des accès (IAM) par rôle et ressource"
    http_sql: "GET /iam/matrix"
    pattern_db: "read-only"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "Vue lisible, exportable ; filtre tenant_id"
    statut: "À développer"


# ── RiskOwnership ──

  - id: ACT-120
    domaine: "RiskOwnership"
    acteur: "Admin / Risk Manager"
    action: "Désigner un Risk Owner pour un risque"
    http_sql: "PATCH /risks/:id — owner_id"
    pattern_db: "in-place update"
    agents_responsables: [A06, A13]
    mvp: true
    regles_critiques: "Owner doit être un utilisateur actif du même tenant ; audit log obligatoire"
    statut: "À développer"

  - id: ACT-121
    domaine: "RiskOwnership"
    acteur: "Admin / Risk Manager"
    action: "Changer le Risk Owner d'un risque (transfert de responsabilité)"
    http_sql: "PATCH /risks/:id — owner_id nouveau"
    pattern_db: "in-place update"
    agents_responsables: [A06, A13]
    mvp: true
    regles_critiques: "Notification à l'ancien et au nouvel owner ; append audit log"
    statut: "À développer"

  - id: ACT-122
    domaine: "RiskOwnership"
    acteur: "Admin"
    action: "Désigner un Risk Owner Supérieur (N+1) rattaché à un risque ou une catégorie"
    http_sql: "PATCH /risks/:id — superior_owner_id"
    pattern_db: "in-place update"
    agents_responsables: [A06, A13]
    mvp: true
    regles_critiques: "Hiérarchie owner < superior_owner ; escalade automatique si seuil atteint"
    statut: "À développer"

  - id: ACT-123
    domaine: "RiskOwnership"
    acteur: "Admin"
    action: "Désigner un Pilote de risque par département"
    http_sql: "PATCH /departments/:id — risk_pilot_id"
    pattern_db: "in-place update"
