actions:
# Backlog fonctionnel GRC Tools — généré depuis la feuille 8 (GRC ACTIONS)
# de docs/acf/ACF_GRC_Tools_v2_COMPLET.xlsx. Source de vérité : le classeur Excel,
# pas ce fichier — regénérer ce fichier si la feuille 8 change.
#
# Chaque agent lit ce backlog pour savoir ce qu’il doit produire :
#  - A03 (Product Manager) : traduit chaque action en user story + critères
#  - A06 (Dev Backend)     : implémente l’endpoint (http_sql) + pattern_db
#  - A07 (Dev DB)          : crée la migration si nouvelle table/colonne
#  - A08 (QA)              : écrit les tests couvrant regles_critiques
#  - A14 (Compliance)      : vérifie le cadre réglementaire de l’action
#  - A23 (Audit)           : garantit que l’action est journalisée (append-only)
#
# Filtrer mvp: true pour le périmètre MVP.



# ── Risk ──

  - id: ACT-001
    domaine: "Risk"
    acteur: "Utilisateur"
    action: "Créer un risque"
    http_sql: "POST /risks — INSERT"
    pattern_db: "in-place update"
    agents_responsables: [A06, A13]
    mvp: true
    regles_critiques: "tenant_id obligatoire"
    statut: "À développer"

  - id: ACT-002
    domaine: "Risk"
    acteur: "Utilisateur"
    action: "Modifier un risque (scoring, statut)"
    http_sql: "PUT /risks/:id — UPDATE"
    pattern_db: "in-place update"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "buildUpdateSet, tenant_id"
    statut: "À développer"

  - id: ACT-003
    domaine: "Risk"
    acteur: "Utilisateur"
    action: "Supprimer un risque (soft)"
    http_sql: "DELETE /risks/:id → deleted_at"
    pattern_db: "soft-delete"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "Jamais DELETE physique"
    statut: "À développer"

  - id: ACT-004
    domaine: "Risk"
    acteur: "Agent A13"
    action: "Calculer la matrice de risques"
    http_sql: "Lecture + scoring interne"
    pattern_db: "read-only"
    agents_responsables: [A13]
    mvp: true
    regles_critiques: "Probabilité × Impact"
    statut: "À développer"

  - id: ACT-005
    domaine: "Risk"
    acteur: "Utilisateur"
    action: "Lier un risque à un contrôle"
    http_sql: "POST /risks/:id/controls"
    pattern_db: "relation"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "tenant_id sur la relation"
    statut: "À développer"


# ── Evidence ──

  - id: ACT-010
    domaine: "Evidence"
    acteur: "Utilisateur"
    action: "Uploader une preuve (fichier)"
    http_sql: "POST /evidences — Google Drive API"
    pattern_db: "in-place update"
    agents_responsables: [A06, A20]
    mvp: true
    regles_critiques: "Google Drive API token"
    statut: "À développer"

  - id: ACT-011
    domaine: "Evidence"
    acteur: "Utilisateur"
    action: "Lier une preuve à un contrôle"
    http_sql: "POST /evidences/:id/link"
    pattern_db: "relation"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "tenant_id"
    statut: "À développer"

  - id: ACT-012
    domaine: "Evidence"
    acteur: "Utilisateur"
    action: "Archiver une preuve"
    http_sql: "PATCH /evidences/:id/archive"
    pattern_db: "soft-delete"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "deleted_at"
    statut: "À développer"


# ── Control ──

  - id: ACT-020
    domaine: "Control"
    acteur: "Utilisateur"
    action: "Créer un contrôle interne"
    http_sql: "POST /controls — INSERT"
    pattern_db: "in-place update"
    agents_responsables: [A06, A14]
    mvp: true
    regles_critiques: "tenant_id, cadre réglementaire"
    statut: "À développer"

  - id: ACT-021
    domaine: "Control"
    acteur: "Utilisateur"
    action: "Modifier un contrôle"
    http_sql: "PUT /controls/:id"
    pattern_db: "in-place update"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "buildUpdateSet"
    statut: "À développer"

  - id: ACT-022
    domaine: "Control"
    acteur: "Utilisateur"
    action: "Désactiver un contrôle"
    http_sql: "PATCH /controls/:id/disable"
    pattern_db: "soft-delete"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "deleted_at"
    statut: "À développer"

  - id: ACT-023
    domaine: "Control"
    acteur: "Agent A14"
    action: "Vérifier la conformité d'un contrôle"
    http_sql: "Lecture + check cadre"
    pattern_db: "read-only"
    agents_responsables: [A14]
    mvp: true
    regles_critiques: "Référence cadre obligatoire"
    statut: "À développer"


# ── ControlExecution ──

  - id: ACT-030
    domaine: "ControlExecution"
    acteur: "Exécuteur"
    action: "Enregistrer une exécution de contrôle"
    http_sql: "POST /control-executions — INSERT"
    pattern_db: "append-only"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "Jamais UPDATE/DELETE. Exécuteur ≠ validateur"
    statut: "À développer"

  - id: ACT-031
    domaine: "ControlExecution"
    acteur: "Validateur"
    action: "Valider une exécution"
    http_sql: "POST /control-executions/:id/validate"
    pattern_db: "append-only"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "Maker-checker : validateur ≠ exécuteur"
    statut: "À développer"


# ── Effectiveness ──

  - id: ACT-040
    domaine: "Effectiveness"
    acteur: "Évaluateur"
    action: "Créer une évaluation d'efficacité"
    http_sql: "POST /effectiveness — INSERT"
    pattern_db: "append-only"
    agents_responsables: [A06, A13]
    mvp: true
    regles_critiques: "Append-only. Jamais de modification"
    statut: "À développer"

  - id: ACT-041
    domaine: "Effectiveness"
    acteur: "Agent A13"
    action: "Agréger les scores d'efficacité"
    http_sql: "Lecture + scoring"
    pattern_db: "read-only"
    agents_responsables: [A13]
    mvp: true
    regles_critiques: "Corrélation avec Risk"
    statut: "À développer"


# ── Anomaly ──

  - id: ACT-050
    domaine: "Anomaly"
    acteur: "Utilisateur / Système"
    action: "Ouvrir une anomalie"
    http_sql: "POST /anomalies — INSERT status=open"
    pattern_db: "ticket-lifecycle"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "tenant_id, statut initial = open"
    statut: "À développer"

  - id: ACT-051
    domaine: "Anomaly"
    acteur: "Responsable"
    action: "Prendre en charge"
    http_sql: "PATCH /anomalies/:id — status=in_progress"
    pattern_db: "ticket-lifecycle"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "Transition valide : open→in_progress"
    statut: "À développer"

  - id: ACT-052
    domaine: "Anomaly"
    acteur: "Responsable"
    action: "Résoudre une anomalie"
    http_sql: "PATCH /anomalies/:id — status=resolved"
    pattern_db: "ticket-lifecycle"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "Transition valide : in_progress→resolved"
    statut: "À développer"

  - id: ACT-053
    domaine: "Anomaly"
    acteur: "Superviseur"
    action: "Fermer une anomalie"
    http_sql: "PATCH /anomalies/:id — status=closed"
    pattern_db: "ticket-lifecycle"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "Transition valide : resolved→closed"
    statut: "À développer"

  - id: ACT-054
    domaine: "Anomaly"
    acteur: "Système"
    action: "Escalader une anomalie"
    http_sql: "PATCH /anomalies/:id — priority=HIGH"
    pattern_db: "ticket-lifecycle"
    agents_responsables: [A06, A13]
    mvp: true
    regles_critiques: "Notification déclenchée"
    statut: "À développer"


# ── Department ──

  - id: ACT-060
    domaine: "Department"
    acteur: "Admin"
    action: "Créer un département"
    http_sql: "POST /departments — INSERT"
    pattern_db: "in-place update"
    agents_responsables: [A06]
    mvp: true
    regles_critiques: "tenant_id"
    statut: "À développer"

  - id: ACT-061
    domaine: "Department"
    acteur: "Admin"
    action: "Modifier un département"
    http_sql: "PUT /departments/:id"
    pattern_db: "in-place update"
    agents_responsables: [A06]
