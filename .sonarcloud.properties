# Rollback scripts restore the previous definitions of SQL functions verbatim (a rollback must give back exactly what
# the migration replaced), so their duplication with earlier migrations is intended. Excluded from duplication only;
# they stay analysed for every other rule.
# catalog.ts is a data copy of the governance principles JSON (D6), kept identical by a sync test: its repeated
# record shape is data, not code. Excluded from duplication only.
sonar.cpd.exclusions=database/postgresql/migrations/*.down.sql,backend/src/domain/governance/catalog.ts
