# Project key is supplied through the SONAR_PROJECT_KEY Actions variable.
# SONAR_ORGANIZATION is required for SonarCloud; SONAR_HOST_URL is used for SonarQube Server.
sonar.projectName=Gouvernance Risk Control Tools
sonar.sourceEncoding=UTF-8
sonar.sources=backend/src,frontend/src,packages
sonar.exclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**,**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts
