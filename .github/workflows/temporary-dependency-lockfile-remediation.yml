name: Temporary dependency lockfile remediation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    if: github.event.pull_request.head.ref == 'fix/zap-authenticated-coverage-gate' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/zap-authenticated-coverage-gate
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Refresh root workspace lockfile
        run: npm audit fix --package-lock-only
      - name: Refresh backend lockfile
        working-directory: backend
        run: npm audit fix --package-lock-only
      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes were generated."
            exit 0
          fi
          git commit -m "fix(deps): update vulnerable dependency lockfiles"
          git push origin HEAD:fix/zap-authenticated-coverage-gate
