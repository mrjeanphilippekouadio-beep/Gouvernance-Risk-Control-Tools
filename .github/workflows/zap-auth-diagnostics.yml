name: ZAP Auth Diagnostics

# Short, manual-only diagnostic run. This does not perform an active scan.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Authentication diagnostics are restricted to staging"
        type: choice
        options:
          - staging
        default: staging

jobs:
  auth-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve a short, staging-only authentication plan
        env:
          ZAP_TARGET_URL: ${{ secrets.ZAP_TARGET_URL }}
          ZAP_API_BASE_URL: https://gouvernance-risk-control-tools-staging.onrender.com
          ZAP_TEST_EMAIL: qagrctest@gmail.com
          ZAP_TEST_PASSWORD: ${{ secrets.ZAP_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          ruby <<'RUBY'
          require "yaml"
          require "uri"

          target_uri = URI.parse(ENV.fetch("ZAP_TARGET_URL"))
          api_uri = URI.parse(ENV.fetch("ZAP_API_BASE_URL"))
          expected_frontend = "gouvernanceriskcontroltools-staging.onrender.com"
          expected_backend = "gouvernance-risk-control-tools-staging.onrender.com"

          unless target_uri.scheme == "https" &&
                 target_uri.host == expected_frontend &&
                 [nil, "", "/"].include?(target_uri.path) &&
                 target_uri.query.nil? && target_uri.fragment.nil?
            abort("ZAP_TARGET_URL must be the staging frontend origin; refusing to test an unexpected target.")
          end
          unless api_uri.scheme == "https" &&
                 api_uri.host == expected_backend &&
                 [nil, "", "/"].include?(api_uri.path) &&
                 api_uri.query.nil? && api_uri.fragment.nil?
            abort("ZAP_API_BASE_URL must be the staging API origin; refusing to test an unexpected target.")
          end

          target_url = "#{target_uri.scheme}://#{target_uri.host}"
          api_url = "#{api_uri.scheme}://#{api_uri.host}"
          plan = YAML.safe_load(File.read(".github/zap/automation-plan.yaml"), aliases: false)
          context = plan.fetch("env").fetch("contexts").find { |item| item.fetch("name") == "grc-tools" }
          abort("Context grc-tools is missing") unless context

          context["urls"] = [target_url, api_url].uniq
          auth = context.fetch("authentication")
          auth.fetch("parameters")["loginPageUrl"] = target_url
          qa_user = context.fetch("users").find { |item| item.fetch("name") == "qa" }
          abort("QA user is missing from ZAP context") unless qa_user
          credentials = qa_user.fetch("credentials")
          credentials["username"] = ENV.fetch("ZAP_TEST_EMAIL")
          credentials["password"] = ENV.fetch("ZAP_TEST_PASSWORD")

          auth.fetch("parameters").fetch("steps", []).each do |step|
            case step.fetch("type")
            when "USERNAME"
              step["value"] = credentials.fetch("username")
            when "PASSWORD"
              step["value"] = credentials.fetch("password")
            when "CUSTOM_FIELD"
              step["value"] = case step.fetch("value", nil)
                              when "${ZAP_TEST_EMAIL}" then credentials.fetch("username")
                              when "${ZAP_TEST_PASSWORD}" then credentials.fetch("password")
                              else step.fetch("value", nil)
                              end
            end
          end

          spider = plan.fetch("jobs").find { |job| job.fetch("type") == "spiderClient" }
          abort("spiderClient job is missing") unless spider
          spider.fetch("parameters")["url"] = target_url
          spider.fetch("parameters")["maxDuration"] = 5
          spider.fetch("parameters")["maxCrawlDepth"] = 6
          spider.fetch("parameters")["maxChildren"] = 75
          spider.fetch("parameters")["initialLoadTime"] = 8
          spider.fetch("parameters")["pageLoadTime"] = 2
          spider.fetch("parameters")["actionWaitTime"] = 1
          spider.fetch("parameters")["shutdownTime"] = 8

          # Deliberately do not include passive wait or activeScan: diagnose login
          # and client-side exploration before spending time on the full scan.
          plan["jobs"] = [
            spider,
            {
              "type" => "export",
              "parameters" => {
                "context" => "grc-tools",
                "type" => "yaml",
                "source" => "clientmap",
                "fileName" => "/zap/wrk/report/client-map.yaml"
              }
            },
            {
              "type" => "export",
              "parameters" => {
                "context" => "grc-tools",
                "type" => "yaml",
                "source" => "sitestree",
                "fileName" => "/zap/wrk/report/site-tree.yaml"
              }
            },
            {
              "type" => "report",
              "parameters" => {
                "template" => "auth-report-json",
                "reportDir" => "/zap/wrk/report",
                "reportFile" => "auth-diagnostics",
                "reportTitle" => "GRC Tools — ZAP Authentication Diagnostics"
              }
            }
          ]

          resolved = YAML.dump(plan)
          if resolved.match?(/\$\{ZAP_(?:TARGET_URL|API_BASE_URL|TEST_EMAIL|TEST_PASSWORD)\}/)
            abort("Unresolved ZAP environment placeholder remains in the diagnostic plan")
          end
          output = File.join(ENV.fetch("RUNNER_TEMP"), "auth-diagnostics-plan.yaml")
          File.write(output, resolved, mode: "w", perm: 0o600)
          RUBY

      - name: Preflight staging frontend and QA authentication
        env:
          ZAP_TARGET_URL: ${{ secrets.ZAP_TARGET_URL }}
          ZAP_API_BASE_URL: https://gouvernance-risk-control-tools-staging.onrender.com
          ZAP_TEST_EMAIL: qagrctest@gmail.com
          ZAP_TEST_PASSWORD: ${{ secrets.ZAP_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 90 \
            "${ZAP_API_BASE_URL}/ready" --output /dev/null

          python3 <<'PY'
          import json
          import os
          import sys
          from html.parser import HTMLParser
          import urllib.error
          import urllib.request

          frontend = os.environ["ZAP_TARGET_URL"].rstrip("/")
          api = os.environ["ZAP_API_BASE_URL"].rstrip("/")
          email = os.environ["ZAP_TEST_EMAIL"]
          password = os.environ["ZAP_TEST_PASSWORD"]

          def fetch(url, timeout=30):
              request = urllib.request.Request(url, headers={"User-Agent": "GRC-ZAP-preflight"})
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return response.read().decode("utf-8", errors="replace")

          html = fetch(frontend)
          class ScriptSourceParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sources = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      src = dict(attrs).get("src", "")
                      if src.split("?", 1)[0].endswith(".js"):
                          self.sources.append(src)

          parser = ScriptSourceParser()
          parser.feed(html)
          assets = parser.sources
          bundle_text = ""
          for asset in assets:
              asset_url = asset if asset.startswith("http") else frontend + (asset if asset.startswith("/") else "/" + asset)
              try:
                  bundle_text += fetch(asset_url)
              except Exception:
                  continue
          if "local-email" not in bundle_text or "local-password" not in bundle_text:
              sys.exit("Staging frontend does not expose the local QA login form. Check VITE_AUTH_PROVIDER=local and redeploy staging.")

          payload = json.dumps({"email": email, "password": password}).encode("utf-8")
          request = urllib.request.Request(
              api + "/api/v1/auth/local",
              data=payload,
              headers={"Content-Type": "application/json", "Accept": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  body = json.loads(response.read().decode("utf-8"))
                  if response.status < 200 or response.status >= 300 or not body.get("accessToken"):
                      sys.exit("Staging QA authentication preflight failed: response contained no access token.")
          except urllib.error.HTTPError as error:
              sys.exit(f"Staging QA authentication preflight failed with HTTP {error.code}; check staging QA credentials and backend logs.")
          except Exception as error:
              sys.exit(f"Staging QA authentication preflight failed ({type(error).__name__}); check staging API readiness.")
          print("PASS: staging login form is present and QA credentials are accepted by the API.")
          PY

      - name: Run browser authentication diagnostics (no active scan)
        env:
          ZAP_API_BASE_URL: https://gouvernance-risk-control-tools-staging.onrender.com
          ZAP_TEST_EMAIL: qagrctest@gmail.com
          ZAP_TEST_PASSWORD: ${{ secrets.ZAP_TEST_PASSWORD }}
        run: |
          set -uo pipefail
          mkdir -p report zap-home
          sudo chown 1000:1000 report zap-home
          plan_path="$RUNNER_TEMP/auth-diagnostics-plan.yaml"
          test -s "$plan_path"
          sudo chown 1000:1000 "$plan_path"
          sudo chmod 600 "$plan_path"

          docker_rc=0
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/report:/zap/wrk/report:rw" \
            -v "${{ github.workspace }}/zap-home:/home/zap/.ZAP:rw" \
            --mount "type=bind,src=$plan_path,dst=/zap/wrk/auth-diagnostics-plan.yaml,readonly" \
            --add-host=zap:127.0.0.1 \
            --entrypoint bash \
            ghcr.io/zaproxy/zaproxy:stable \
            -c 'test -r /zap/wrk/auth-diagnostics-plan.yaml || { echo "Diagnostic plan unreadable" >&2; exit 1; }; zap.sh -cmd -host 127.0.0.1 -port 8080 -autorun /zap/wrk/auth-diagnostics-plan.yaml; rc=$?; echo "ZAP diagnostic plan exit code: $rc"; exit $rc' || docker_rc=$?

          sudo chown -R "$(id -u):$(id -g)" report
          chmod -R u+rwX report
          rm -f "$plan_path"
          if [ ! -s report/auth-diagnostics.json ]; then
            echo "::error::ZAP did not produce auth-diagnostics.json; diagnostics cannot be interpreted."
            exit 1
          fi
          if [ ! -s report/client-map.yaml ]; then
            echo "::error::ZAP did not produce client-map.yaml."
            exit 1
          fi
          if [ ! -s report/site-tree.yaml ]; then
            echo "::error::ZAP did not produce site-tree.yaml."
            exit 1
          fi
          echo "Diagnostic scanner exit code: $docker_rc (warnings may produce exit code 2)."

      - name: Extract a sanitized diagnostic summary
        id: summarize
        env:
          ZAP_TEST_EMAIL: qagrctest@gmail.com
          ZAP_TEST_PASSWORD: ${{ secrets.ZAP_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          ruby -ryaml -rjson -e 'File.write(ARGV.fetch(1), JSON.generate(YAML.safe_load(File.read(ARGV.fetch(0)), aliases: false)))' report/client-map.yaml report/client-map.json
          ruby -ryaml -rjson -e 'File.write(ARGV.fetch(1), JSON.generate(YAML.safe_load(File.read(ARGV.fetch(0)), aliases: false)))' report/site-tree.yaml report/site-tree.json
          python3 <<'PY'
          import json
          import os
          import re
          import urllib.parse
          from pathlib import Path

          report = json.loads(Path("report/auth-diagnostics.json").read_text(encoding="utf-8"))
          items = report.get("summaryItems", [])
          lines = [
              "# ZAP browser authentication diagnostics",
              "",
              "This is a short diagnostic run; no active scan was executed.",
              "",
              "## Authentication checks",
          ]
          if not items:
              lines.append("- ZAP did not emit authentication summary items; inspect plan/setup before interpreting this result.")
          for item in items:
              passed = item.get("passed")
              mark = "PASS" if passed is True else "FAIL" if passed is False else "INFO"
              desc = re.sub(r"[\r\n]+", " ", str(item.get("description", item.get("key", "Unspecified check"))))
              lines.append(f"- **{mark}** — {desc}")

          failures = report.get("failureReasons", [])
          if failures:
              lines.extend(["", "## Failure reasons"])
              for item in failures:
                  desc = re.sub(r"[\r\n]+", " ", str(item.get("description", item.get("key", "Unspecified failure"))))
                  lines.append(f"- {desc}")

          diagnostics = report.get("diagnostics", [])
          lines.extend(["", "## Browser steps"])
          step_count = 0
          error_steps = 0
          for attempt, entry in enumerate(diagnostics, 1):
              lines.append(f"- Attempt {attempt}: method={entry.get('authenticationMethod', 'unknown')}; user={entry.get('user', 'unknown')}")
              for step in entry.get("steps", []):
                  step_count += 1
                  desc = re.sub(r"[\r\n]+", " ", str(step.get("description", "Step without description")))
                  raw_url = str(step.get("url", ""))
                  parsed = urllib.parse.urlsplit(raw_url)
                  safe_url = f"{parsed.scheme}://{parsed.netloc}{parsed.path}" if parsed.scheme and parsed.netloc else "(URL not recorded)"
                  lines.append(f"  - {desc} — {safe_url}")
                  if "error" in desc.lower():
                      error_steps += 1
          if not diagnostics:
              lines.append("- No browser authentication diagnostic attempts were recorded by ZAP.")
          else:
              lines.append(f"- Recorded {step_count} browser step(s) across {len(diagnostics)} attempt(s); error-labelled steps: {error_steps}.")

          client_map = json.loads(Path("report/client-map.json").read_text(encoding="utf-8"))
          visited = []
          def walk_client_map(node):
              if isinstance(node, dict):
                  if isinstance(node.get("url"), str) and node.get("visited") is True:
                      parsed = urllib.parse.urlsplit(node["url"])
                      visited.append(f"{parsed.scheme}://{parsed.netloc}{parsed.path}" if parsed.scheme and parsed.netloc else node["url"])
                  for value in node.values():
                      walk_client_map(value)
              elif isinstance(node, list):
                  for value in node:
                      walk_client_map(value)
          walk_client_map(client_map)
          visited = list(dict.fromkeys(visited))

          api_host = "gouvernance-risk-control-tools-staging.onrender.com"
          site_tree = json.loads(Path("report/site-tree.json").read_text(encoding="utf-8"))
          successful_api_paths = set()
          module_paths = set()
          def walk_site_tree(node):
              if isinstance(node, dict):
                  raw_url = node.get("url")
                  method = str(node.get("method", "")).upper()
                  code = node.get("statusCode")
                  if isinstance(raw_url, str):
                      parsed = urllib.parse.urlsplit(raw_url)
                      path = parsed.path or ""
                      if parsed.hostname == api_host and path.startswith("/api/v1/") and method == "GET":
                          if isinstance(code, int) and 200 <= code < 300:
                              successful_api_paths.add(path)
                          # A 403 proves the authenticated view was reached but
                          # the QA identity lacks that module permission. It is
                          # reported as visited, not misclassified as unauthenticated.
                          if isinstance(code, int) and (200 <= code < 300 or code == 403):
                              module_paths.add(path)
                  for value in node.values():
                      walk_site_tree(value)
              elif isinstance(node, list):
                  for value in node:
                      walk_site_tree(value)
          walk_site_tree(site_tree)

          module_rules = {
              "cartography": lambda p: p == "/api/v1/cartography" or p.startswith("/api/v1/cartography/"),
              "risk_register": lambda p: p == "/api/v1/risks" or p.startswith("/api/v1/risks/"),
              "risk_evaluation": lambda p: p == "/api/v1/risk-evaluations" or p.startswith("/api/v1/risk-evaluations/"),
              "risk_appetite": lambda p: p == "/api/v1/appetite" or p.startswith("/api/v1/appetite/"),
              "rating_scales": lambda p: p == "/api/v1/rating-scales" or p.startswith("/api/v1/rating-scales/"),
              "controls": lambda p: p == "/api/v1/controls" or p.startswith("/api/v1/controls/"),
              "control_monitoring": lambda p: p == "/api/v1/executions" or p.startswith("/api/v1/executions/") or p == "/api/v1/effectiveness" or p.startswith("/api/v1/effectiveness/"),
              "audit": lambda p: p == "/api/v1/audit-missions" or p.startswith("/api/v1/audit-missions/") or p == "/api/v1/findings" or p.startswith("/api/v1/findings/"),
              "action_plans": lambda p: p == "/api/v1/dashboard/actions" or p.startswith("/api/v1/dashboard/actions/") or p == "/api/v1/actions" or p.startswith("/api/v1/actions/"),
          }
          covered_modules = [name for name, predicate in module_rules.items() if any(predicate(path) for path in module_paths)]
          # Browser-based authentication on this React SPA keeps the JWT in
          # client state. ZAP's Authentication Report can therefore report FAIL
          # after its helper's post-submit WAIT even when the browser successfully
          # calls protected API routes. Prove the session from the browser's own
          # Sites Tree requests instead: five distinct successful protected GETs
          # and at least one successful request for each counted module group.
          # Keep ZAP's auth report visible as a diagnostic signal, not the sole gate.
          auth_report_ok = any(
              item.get("key") == "auth.summary.auth" and item.get("passed") is True
              for item in items
          )
          protected_api_count = len(successful_api_paths)
          module_coverage_count = len(covered_modules)
          auth_ok = protected_api_count >= 5 and module_coverage_count >= 6
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"auth_ok={'true' if auth_ok else 'false'}\n")
              output.write(f"protected_api_count={protected_api_count}\n")
              output.write(f"module_coverage_count={module_coverage_count}\n")

          lines.extend([
              "",
              "## Authentication evidence",
              f"- ZAP Authentication Report verdict: {'PASS' if auth_report_ok else 'FAIL'}",
              f"- Protected API evidence gate: {'PASS' if protected_api_count >= 5 else 'FAIL'}",
              "",
              "## Authenticated API and module coverage",
              f"- Distinct protected API paths with successful GET responses: {protected_api_count}",
              f"- GRC modules reached through protected GET requests: {module_coverage_count}/9",
              "- Covered modules: " + (", ".join(covered_modules) if covered_modules else "none"),
              "",
              "## Client Map (informational)",
              f"- Nodes explicitly marked visited: {len(visited)}",
          ])
          for url in visited[:20]:
              lines.append(f"- {url}")
          lines.append("- Client Map visit flags are not used as the pass/fail gate because SPA module changes are state transitions and do not necessarily create new URLs.")

          secrets = [os.environ.get("ZAP_TEST_EMAIL", ""), os.environ.get("ZAP_TEST_PASSWORD", "")]
          clean_lines = []
          for line in lines:
              for secret in secrets:
                  if secret:
                      line = line.replace(secret, "[REDACTED]")
              line = re.sub(r"(?i)Bearer\s+[^\s\"']+", "Bearer [REDACTED]", line)
              line = re.sub(r"\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{5,}\b", "[REDACTED_TOKEN]", line)
              clean_lines.append(line)
          lines = clean_lines

          Path("report/diagnostic-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          Path("report/auth-diagnostics.json").unlink(missing_ok=True)
          Path("report/client-map.yaml").unlink(missing_ok=True)
          Path("report/client-map.json").unlink(missing_ok=True)
          Path("report/site-tree.yaml").unlink(missing_ok=True)
          Path("report/site-tree.json").unlink(missing_ok=True)
          print("\n".join(lines))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zap-auth-diagnostic-summary
          path: report/diagnostic-summary.md
          if-no-files-found: warn

      - name: Enforce authentication and browser coverage gates
        if: always()
        env:
          AUTH_OK: ${{ steps.summarize.outputs.auth_ok }}
          PROTECTED_API_COUNT: ${{ steps.summarize.outputs.protected_api_count }}
          MODULE_COVERAGE_COUNT: ${{ steps.summarize.outputs.module_coverage_count }}
        run: |
          set -euo pipefail
          if [ "$AUTH_OK" != "true" ]; then
            echo "::error::The browser Sites Tree did not prove an authenticated session (requires at least 5 distinct successful protected GET paths and 6/9 module groups). See the sanitized diagnostic summary artifact."
            exit 1
          fi
          if ! [[ "$PROTECTED_API_COUNT" =~ ^[0-9]+$ ]] || [ "$PROTECTED_API_COUNT" -lt 5 ]; then
            echo "::error::Fewer than 5 distinct protected API paths returned successful GET responses."
            exit 1
          fi
          if ! [[ "$MODULE_COVERAGE_COUNT" =~ ^[0-9]+$ ]] || [ "$MODULE_COVERAGE_COUNT" -lt 6 ]; then
            echo "::error::The browser reached fewer than 6 of the 9 required GRC module API groups."
            exit 1
          fi
          echo "PASS: ZAP authenticated successfully, reached $PROTECTED_API_COUNT protected API path(s), and covered $MODULE_COVERAGE_COUNT GRC module group(s)."
