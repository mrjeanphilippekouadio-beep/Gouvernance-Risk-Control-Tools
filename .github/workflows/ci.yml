name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      # package-lock.json is generated on Windows and, per npm/cli#4828,
      # its resolved-package entries for OS-specific optionalDependencies
      # (rolldown's native binding for vite 8) don't carry over to other
      # platforms. Re-resolving fresh on the Linux runner avoids replaying
      # that stale lockfile; --package-lock=false stops it from being
      # rewritten in the workspace (kept as-is for local/Windows use).
      - run: rm -f package-lock.json
      - run: npm install --package-lock=false
      - run: npm run build --workspace=@djamo/design-system
      - run: npm run build --workspace=@grc-tools/frontend

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Semgrep — static analysis (SAST). Public community ruleset (p/ci).
      # Findings are blocking: the CI must fail on detected security issues.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - run: semgrep scan --config p/ci --sarif --output semgrep-results.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-results
          path: semgrep-results.sarif
          if-no-files-found: ignore

      # Trivy — dependency vulnerability scan (backend + frontend
      # package-lock.json). Fails the job on HIGH/CRITICAL findings.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
