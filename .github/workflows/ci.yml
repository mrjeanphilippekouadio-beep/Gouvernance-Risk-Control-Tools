name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      # npm ci (npm/cli#4828): optional platform-specific deps (rolldown's
      # native binding for vite 8) can be dropped from a workspace lockfile
      # generated on a different OS. npm install re-resolves them correctly.
      - run: npm install
      - run: npm run build --workspace=@djamo/design-system
      - run: npm run build --workspace=@grc-tools/frontend
