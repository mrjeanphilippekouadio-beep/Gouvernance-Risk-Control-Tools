name: CI

# Default-deny token policy for every job in this workflow.
# Jobs only need to read repository contents; no write permission is required.
permissions:
  contents: read

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      # Use the committed lockfile for a reproducible Linux install.
      # The required x64/glibc native bindings are explicitly present in the
      # lockfile; do not silently re-resolve dependencies in CI.
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test --workspace=@djamo/design-system
      - run: npm run build --workspace=@djamo/design-system
      - run: npm run build --workspace=@grc-tools/frontend
      - run: npm run lint --workspace=@grc-tools/frontend

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Gitleaks — detect hardcoded secrets in the current tree and git history.
      # v3 uses the Node 24 runtime and is the maintained release line.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR comments are disabled, so the workflow needs no pull-request write scope.
          GITLEAKS_ENABLE_COMMENTS: "false"

      # Semgrep — static analysis (SAST). Public community ruleset (p/ci).
      # Findings are blocking: the CI must fail on detected security issues.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r .github/security-requirements.txt
      - name: Semgrep security scan
        run: semgrep scan --error --config p/ci --sarif --output semgrep-results.sarif

      # Always print human-readable findings, even when the blocking scan fails.
      - name: Semgrep findings (diagnostic output)
        if: always()
        run: semgrep scan --config p/ci --text || true

      # Preserve the machine-readable report even when Semgrep blocks the job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.sarif
          if-no-files-found: ignore

      # Trivy — dependency vulnerability scan (backend + frontend
      # package-lock.json). Fails the job on HIGH/CRITICAL findings.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
