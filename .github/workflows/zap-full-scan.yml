name: ZAP Full Scan

# Default-deny token policy, same convention as ci.yml.
permissions:
  contents: read

# Manual staging-only active scan. It sends real attack payloads and must not
# be selectable against production. Keep it off push/pull_request.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Active ZAP scans are restricted to the staging environment"
        type: choice
        options:
          - staging
        default: staging

jobs:
  zap-full-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and validate ZAP plan
        env:
          ZAP_TARGET_URL: ${{ secrets.ZAP_TARGET_URL }}
          ZAP_API_BASE_URL: https://gouvernance-risk-control-tools-staging.onrender.com
          ZAP_TEST_EMAIL: qagrctest@gmail.com
          ZAP_TEST_PASSWORD: ${{ secrets.ZAP_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          # The resolved file contains the QA password. Keep it owner-readable
          # only; it lives outside the workspace and is removed after the scan.
          umask 077
          ruby <<'RUBY'
          require "yaml"
          require "uri"

          target_uri = URI.parse(ENV.fetch("ZAP_TARGET_URL"))
          api_uri = URI.parse(ENV.fetch("ZAP_API_BASE_URL"))
          expected_frontend = "gouvernanceriskcontroltools-staging.onrender.com"
          expected_backend = "gouvernance-risk-control-tools-staging.onrender.com"

          unless target_uri.scheme == "https" &&
                 target_uri.host == expected_frontend &&
                 [nil, "", "/"].include?(target_uri.path) &&
                 target_uri.query.nil? && target_uri.fragment.nil?
            abort("ZAP_TARGET_URL must be the staging frontend origin; refusing to scan an unexpected target.")
          end

          unless api_uri.scheme == "https" &&
                 api_uri.host == expected_backend &&
                 [nil, "", "/"].include?(api_uri.path) &&
                 api_uri.query.nil? && api_uri.fragment.nil?
            abort("ZAP_API_BASE_URL is not the expected staging API origin; refusing to scan an unexpected target.")
          end

          target_url = "#{target_uri.scheme}://#{target_uri.host}"
          api_url = "#{api_uri.scheme}://#{api_uri.host}"
          plan = YAML.safe_load(File.read(".github/zap/automation-plan.yaml"), aliases: false)
          context = plan.fetch("env").fetch("contexts").find { |item| item.fetch("name") == "grc-tools" }
          abort("Context grc-tools is missing") unless context

          # ZAP authenticates through the frontend but the API is a distinct
          # Render origin. Both must belong to the same ZAP context.
          context["urls"] = [target_url, api_url].uniq
          auth = context.fetch("authentication")
          auth.fetch("parameters")["loginPageUrl"] = target_url

          qa_user = context.fetch("users").find { |item| item.fetch("name") == "qa" }
          abort("QA user is missing from ZAP context") unless qa_user
          credentials = qa_user.fetch("credentials")
          credentials["username"] = ENV.fetch("ZAP_TEST_EMAIL")
          credentials["password"] = ENV.fetch("ZAP_TEST_PASSWORD")

          # The shared plan defines explicit React login selectors. The Client
          # Spider then explores the interactive SPA; module coverage is checked
          # from the protected API requests in the exported Sites Tree.

          plan.fetch("jobs").each do |job|
            next unless %w[spider spiderClient].include?(job.fetch("type"))
            job.fetch("parameters")["url"] = target_url
          end

          resolved = YAML.dump(plan)
          if resolved.match?(/\$\{ZAP_(?:TARGET_URL|API_BASE_URL|TEST_EMAIL|TEST_PASSWORD)\}/)
            abort("Unresolved ZAP environment placeholder remains in the plan")
          end

          output = File.join(ENV.fetch("RUNNER_TEMP"), "automation-plan.resolved.yaml")
          File.write(output, resolved, mode: "w", perm: 0o600)
          RUBY

      - name: Preflight staging frontend and QA authentication
        env:
          ZAP_API_BASE_URL: https://gouvernance-risk-control-tools-staging.onrender.com
          ZAP_TARGET_URL: ${{ secrets.ZAP_TARGET_URL }}
          ZAP_TEST_EMAIL: qagrctest@gmail.com
          ZAP_TEST_PASSWORD: ${{ secrets.ZAP_TEST_PASSWORD }}
        run: |
          set -euo pipefail

          # Wake a sleeping Render service before ZAP's browser-auth helper
          # makes its first login request. Do not print response bodies or tokens.
          echo "Checking staging API readiness..."
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 90 \
            "${ZAP_API_BASE_URL}/ready" --output /dev/null

          python3 <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          frontend = os.environ["ZAP_TARGET_URL"].rstrip("/")
          api = os.environ["ZAP_API_BASE_URL"].rstrip("/")
          email = os.environ["ZAP_TEST_EMAIL"]
          password = os.environ["ZAP_TEST_PASSWORD"]

          # Fail early if Render is serving a Google-only build instead of the
          # local-login UI expected by the staging-only ZAP test.
          def fetch(url, timeout=30):
              request = urllib.request.Request(url, headers={"User-Agent": "GRC-ZAP-preflight"})
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return response.read().decode("utf-8", errors="replace")

          html = fetch(frontend)
          assets = re.findall(r'<script[^>]+src=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']', html)
          bundle_text = ""
          for asset in assets:
              asset_url = asset if asset.startswith("http") else frontend + (asset if asset.startswith("/") else "/" + asset)
              try:
                  bundle_text += fetch(asset_url)
              except Exception:
                  continue
          if "local-email" not in bundle_text or "local-password" not in bundle_text:
              sys.exit("Staging frontend bundle does not expose the local QA login form. Verify VITE_AUTH_PROVIDER=local and redeploy staging.")

          # Authenticate once outside ZAP to warm the backend and validate the
          # QA credentials. Never print the request body, response body or token.
          payload = json.dumps({"email": email, "password": password}).encode("utf-8")
          request = urllib.request.Request(
              api + "/api/v1/auth/local",
              data=payload,
              headers={"Content-Type": "application/json", "Accept": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  body = json.loads(response.read().decode("utf-8"))
                  if response.status < 200 or response.status >= 300 or not body.get("accessToken"):
                      sys.exit("Staging QA authentication preflight failed: response did not contain an access token.")
          except urllib.error.HTTPError as error:
              sys.exit(f"Staging QA authentication preflight failed with HTTP {error.code}; check QA credentials and backend logs.")
          except Exception as error:
              sys.exit(f"Staging QA authentication preflight failed ({type(error).__name__}); check staging API readiness.")
          print("Staging frontend local-login form is present and QA authentication succeeded.")
          PY

      - name: ZAP authenticated full scan
        id: zap_scan
        env:
          ZAP_API_BASE_URL: https://gouvernance-risk-control-tools-staging.onrender.com
          ZAP_TARGET_URL: ${{ secrets.ZAP_TARGET_URL }}
          ZAP_TEST_EMAIL: qagrctest@gmail.com
          ZAP_TEST_PASSWORD: ${{ secrets.ZAP_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p report zap-home
          # The stable image runs as uid 1000 ("zap"). Do not make the
          # workspace world-writable just to let ZAP produce its reports.
          sudo chown 1000:1000 report zap-home

          plan_path="$RUNNER_TEMP/automation-plan.resolved.yaml"
          if [ ! -s "$plan_path" ]; then
            echo "::error::Resolved ZAP plan is missing or empty; refusing to start the scanner."
            exit 1
          fi
          # The official image runs as uid 1000 ("zap"), while the runner
          # creates this secret-bearing file as its own user. Keep mode 0600
          # and transfer ownership so the non-root container user can read it.
          sudo chown 1000:1000 "$plan_path"
          sudo chmod 600 "$plan_path"

          rc=0
          # The browser extension uses the proxy host "zap". In a standalone
          # docker run there is no Compose DNS, so map it to loopback AND
          # explicitly start ZAP's main proxy listener on that same address.
          # The host mapping alone did not clear proxyConnectFailure in #161.
          # Mount the plan below /zap/wrk: the official image has this directory
          # for scan artifacts. /zap/plan is not guaranteed to exist (the prior
          # attempt failed before AF could read its plan).
          # The Client Spider browser extension calls back through the proxy host "zap".
          # Run ZAP with the runner's host network namespace so Firefox can reach the
          # proxy consistently; keep the explicit alias because the extension uses it.
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/report:/zap/wrk/report:rw" \
            -v "${{ github.workspace }}/zap-home:/home/zap/.ZAP:rw" \
            --mount "type=bind,src=$plan_path,dst=/zap/wrk/automation-plan.resolved.yaml,readonly" \
            --add-host=zap:127.0.0.1 \
            --entrypoint bash \
            ghcr.io/zaproxy/zaproxy:stable \
            -c 'test -r /zap/wrk/automation-plan.resolved.yaml || { echo "Resolved plan is not readable inside ZAP container" >&2; exit 1; }; zap.sh -cmd -host 127.0.0.1 -port 8080 -autorun /zap/wrk/automation-plan.resolved.yaml; rc=$?; echo "===ZAP LOG(S) FOUND ON DISK==="; find /home /zap /tmp /root -iname "zap.log*" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null; exit $rc' || rc=$?

          # ZAP runs as uid 1000 and creates root-owned-to-ZAP report files.
          # Return ownership to the runner before redaction; never chmod the
          # workspace broadly or publish an artifact if sanitization fails.
          sudo chown -R "$(id -u):$(id -g)" report
          chmod -R u+rwX report

          zap_log="zap-home/zap.log"
          if [ ! -s "$zap_log" ]; then
            echo "::error::ZAP log is missing; authenticated browser configuration cannot be verified."
            rc=1
          else
            if grep -Fq "RedirectScript - Failed to configure ZAP extension on browser launch" "$zap_log"; then
              # This warning is emitted by the auxiliary browser used by some
              # active DOM-XSS rules. It can occur after spiderClient has
              # completed successfully; do not confuse it with a failed crawl.
              # The hard gates below still require completed crawling/scanning,
              # exported Client Map/Sites Tree, and successful API responses.
              echo "::warning::ZAP could not configure its auxiliary browser for one or more DOM-XSS checks. Review DOM-XSS coverage separately; this does not override the crawl/API evidence gates."
            fi
            if grep -Fq "insight.auth.failure" "$zap_log"; then
              echo "::error::ZAP reported authentication failure; refusing to accept an unauthenticated scan."
              rc=1
            fi
            if ! grep -Fq "Job spiderClient finished" "$zap_log"; then
              echo "::error::The authenticated Client Spider did not finish."
              rc=1
            fi
            if ! grep -Fq "Job activeScan finished" "$zap_log"; then
              echo "::error::The active scan did not finish."
              rc=1
            fi
          fi

          # Exported Sites Tree is evidence, not just the alert-only report.
          # Require at least the login, identity-verification and one further
          # backend endpoint so a green job cannot mean "login page only".
          if [ ! -s report/site-tree.yaml ]; then
            echo "::error::ZAP Sites Tree evidence is missing."
            rc=1
          else
            if ! ruby -ryaml -ruri -e '
              api_host = URI.parse(ENV.fetch("ZAP_API_BASE_URL")).host
              tree = YAML.safe_load(File.read(ARGV.fetch(0)), aliases: false)
              urls = []
              successful_urls = []
              walk = lambda do |node|
                case node
                when Hash
                  if node["url"].is_a?(String)
                    begin
                      uri = URI.parse(node["url"])
                      if uri.host == api_host && uri.path && uri.path != "/" && !uri.path.empty?
                        urls << uri.path
                        code = node["statusCode"]
                        method = node["method"].to_s.upcase
                        path = uri.path
                        # A successful CORS preflight, login response, or public
                        # health check does not prove access to the protected API.
                        protected_api_path =
                          path.start_with?("/api/v1/") &&
                          path != "/api/v1/auth" &&
                          !path.start_with?("/api/v1/auth/") &&
                          path != "/health" &&
                          path != "/ready"
                        if protected_api_path &&
                           !%w[OPTIONS HEAD].include?(method) &&
                           code.is_a?(Integer) &&
                           (200..299).cover?(code)
                          successful_urls << path
                        end
                      end
                    rescue URI::InvalidURIError
                      # Ignore malformed/non-URL tree labels.
                    end
                  end
                  node.each_value { |value| walk.call(value) }
                when Array
                  node.each { |value| walk.call(value) }
                end
              end
              walk.call(tree)
              paths = urls.uniq
              successful_paths = successful_urls.uniq
              if paths.length < 3
                warn "::error::ZAP coverage gate failed: fewer than 3 distinct non-root API paths were captured."
                exit 1
              end
              if successful_paths.empty?
                warn "::error::ZAP coverage gate failed: no successful (2xx) response from a protected API path was captured; authentication is unproven."
                exit 1
              end
              puts "ZAP API coverage gate passed (#{paths.length} distinct non-root API paths; #{successful_paths.length} distinct protected API paths with non-OPTIONS/HEAD 2xx responses)."
            ' report/site-tree.yaml; then
              rc=1
            fi
          fi

          # Client Map is retained as diagnostic evidence, but its visited flag is
          # not a reliable SPA module signal when React changes view state without
          # changing the URL. The Sites Tree module gate above/below uses the
          # authenticated GET endpoints actually reached by the browser.
          if [ ! -s report/client-map.yaml ]; then
            echo "::error::ZAP Client Map evidence is missing."
            rc=1
          fi

          if ! ruby -ryaml -ruri -e '
            api_host = URI.parse(ENV.fetch("ZAP_API_BASE_URL")).host
            tree = YAML.safe_load(File.read(ARGV.fetch(0)), aliases: false)
            paths = []
            walk = lambda do |node|
              case node
              when Hash
                if node["url"].is_a?(String)
                  begin
                    uri = URI.parse(node["url"])
                    code = node["statusCode"]
                    method = node["method"].to_s.upcase
                    if uri.host == api_host &&
                       uri.path.to_s.start_with?("/api/v1/") &&
                       method == "GET" &&
                       code.is_a?(Integer) &&
                       ((200..299).cover?(code) || code == 403)
                      paths << uri.path
                    end
                  rescue URI::InvalidURIError
                    # Ignore non-URL labels.
                  end
                end
                node.each_value { |value| walk.call(value) }
              when Array
                node.each { |value| walk.call(value) }
              end
            end
            walk.call(tree)
            groups = {
              "cartography" => ->(p) { p.start_with?("/api/v1/cartography/") },
              "risk_register" => ->(p) { p == "/api/v1/risks" || p.start_with?("/api/v1/risks/") },
              "risk_evaluation" => ->(p) { p.start_with?("/api/v1/risk-evaluations") },
              "risk_appetite" => ->(p) { p.start_with?("/api/v1/appetite") },
              "rating_scales" => ->(p) { p.start_with?("/api/v1/rating-scales") },
              "controls" => ->(p) { p.start_with?("/api/v1/controls") },
              "control_monitoring" => ->(p) { p.start_with?("/api/v1/executions") || p.start_with?("/api/v1/effectiveness") },
              "audit" => ->(p) { p.start_with?("/api/v1/audit-missions") || p.start_with?("/api/v1/findings") },
              "action_plans" => ->(p) { p.start_with?("/api/v1/dashboard/actions") || p.start_with?("/api/v1/actions") }
            }
            covered = groups.select { |_name, predicate| paths.any? { |path| predicate.call(path) } }.keys
            if covered.length < 6
              warn "::error::ZAP SPA coverage gate failed: only #{covered.length}/9 GRC module groups reached through authenticated GET requests (#{covered.join(', ')})."
              exit 1
            end
            puts "ZAP SPA coverage gate passed (#{covered.length}/9 GRC module groups: #{covered.join(', ')})."
          ' report/site-tree.yaml; then
            rc=1
          fi

          for report_file in report_html.html report_md.md report_json.json client-map.yaml; do
            if [ ! -s "report/$report_file" ]; then
              echo "::error::Expected ZAP artifact report/$report_file is missing."
              rc=1
            fi
          done

          # Reports are published as workflow artifacts. Redact credentials in
          # every text report and fail closed if any supported representation
          # remains. Artifact upload is enabled only after this step succeeds.
          python3 <<'PY'
          import html
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote, quote_plus

          report_dir = Path("report")
          secrets_to_mask = [
              os.environ.get("ZAP_TEST_EMAIL", ""),
              os.environ.get("ZAP_TEST_PASSWORD", ""),
          ]
          replacements = set()
          for secret in secrets_to_mask:
              if not secret:
                  continue
              replacements.update({
                  secret,
                  quote(secret, safe=""),
                  quote_plus(secret, safe=""),
                  json.dumps(secret, ensure_ascii=True)[1:-1],
                  html.escape(secret, quote=True),
                  # ZAP HTML reports may use the Thymeleaf &#39; apostrophe entity.
                  html.escape(secret, quote=True).replace("&#x27;", "&#39;"),
              })
          replacements = {value for value in replacements if value}

          for file_path in report_dir.rglob("*"):
              if not file_path.is_file():
                  continue
              try:
                  raw = file_path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  # Do not publish an uninspectable report file.
                  raise SystemExit(f"Refusing to publish non-text report: {file_path}")
              masked = raw
              for secret in sorted(replacements, key=len, reverse=True):
                  masked = masked.replace(secret, "[REDACTED_QA_CREDENTIAL]")
              if masked != raw:
                  file_path.write_text(masked, encoding="utf-8")
                  print(f"Redacted QA credentials from {file_path}")

          # Verify after writing, rather than assuming that the rewrite worked.
          for file_path in report_dir.rglob("*"):
              if not file_path.is_file():
                  continue
              text = file_path.read_text(encoding="utf-8")
              if any(secret in text for secret in replacements):
                  raise SystemExit(
                      f"Refusing to publish report: credential representation remains in {file_path}"
                  )
          PY

          echo "reports_safe=true" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/automation-plan.resolved.yaml"
          echo "ZAP exit code: $rc"
          # Exit 2 means the plan ran with warnings (including detected alerts).
          # Real execution errors and failed authentication/coverage gates fail.
          if [ "$rc" = "1" ]; then
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.zap_scan.outputs.reports_safe == 'true'
        with:
          name: zap-full-scan-report
          path: report/
          if-no-files-found: warn
