name: ZAP Full Scan

# Default-deny token policy, same convention as ci.yml.
permissions:
  contents: read

# Manual trigger only. This runs ZAP's *active* scan (real XSS/SQLi/etc.
# payloads against the target), authenticated as a dedicated QA account —
# never wire this to push/pull_request.
# Safe here because ZAP_TARGET_URL points at an environment whose DB only
# holds test data, never real user records.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub environment holding ZAP_TARGET_URL / ZAP_TEST_PASSWORD"
        type: choice
        options:
          - staging
          - production
        default: staging

jobs:
  zap-full-scan:
    runs-on: ubuntu-latest
    # Safety net: spiderAjax/activeScan have their own per-job max durations
    # (see automation-plan.yaml) but bound the whole job in case of a hang.
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve ZAP automation plan secrets
        # ZAP's own Automation Framework ${VAR} substitution resolves fine
        # for context.urls / authentication.parameters.loginPageUrl (confirmed:
        # GitHub's secret masking showed *** there, proving the real value was
        # substituted in) but silently FAILS for
        # authentication.verification.pollUrl: the poll request was sent with
        # the literal, unsubstituted string "${ZAP_TARGET_URL}/api/v1/users/me"
        # (org.apache.commons.httpclient.URIException: incorrect path, seen
        # on every run). Every verification poll then errored, so ZAP could
        # never confirm a login succeeded even when it did — THIS, not the
        # rate limiter, is what produced the 42%/80% "authentication failure"
        # aborts. Fix: substitute the variables ourselves before ZAP ever
        # parses the file, so AF's partial/inconsistent substitution is never
        # in the loop.
        env:
          ZAP_TARGET_URL: ${{ secrets.ZAP_TARGET_URL }}
          ZAP_TEST_EMAIL: "qagrctest@gmail.com"
          ZAP_TEST_PASSWORD: ${{ secrets.ZAP_TEST_PASSWORD }}
        run: |
          envsubst '$ZAP_TARGET_URL $ZAP_TEST_EMAIL $ZAP_TEST_PASSWORD' \
            < .github/zap/automation-plan.yaml \
            > "$RUNNER_TEMP/automation-plan.resolved.yaml"

      - name: ZAP Full Scan (authenticated, via Automation Framework)
        # No marketplace action here: authenticating as a real QA user
        # (browser-driven login + header-based session management, see
        # automation-plan.yaml) requires an Automation Framework plan,
        # which zaproxy/action-full-scan does not expose — so the ZAP
        # stable image is run directly with the plan mounted in.
        run: |
          mkdir -p report zap-home
          # The image runs as its own non-root "zap" user, uid 1000
          # (docker/Dockerfile-stable: `useradd -u 1000 ... zap`), which
          # doesn't own this bind-mounted directory by default (first run
          # failed with AccessDeniedException writing report_html.html).
          # Hand it over to that exact uid rather than opening it to everyone.
          sudo chown 1000:1000 report zap-home
          set +e
          # Every browser-driven step (spiderAjax/Crawljax, and the DomXss /
          # ActiveScript active-scan rules, which also launch a real
          # headless Firefox) logged
          # "RedirectScript - Failed to configure ZAP extension on browser
          # launch" followed by Firefox reaching
          # about:neterror?e=proxyConnectFailure for
          # https://zap/zapCallBackUrl/... — the browser's proxy config
          # points at hostname "zap", a convention from ZAP's official
          # docker-compose setups (where the service is literally named
          # "zap" and gets that hostname for free via Compose's DNS). We run
          # this as a single standalone `docker run`, so nothing resolves
          # "zap" inside the container, the extension can never phone back,
          # and every browser-driven job silently falls back to crawling/
          # scanning with no ZAP proxy in the loop — explaining why
          # Crawljax never saw the authenticated app (0 links beyond the
          # login form) even after auth itself started working. Map it to
          # the container's own loopback so it resolves to ZAP itself.
          docker run --rm \
            -v "${{ github.workspace }}/report:/zap/wrk/report:rw" \
            -v "${{ github.workspace }}/zap-home:/home/zap/.ZAP:rw" \
            -v "$RUNNER_TEMP/automation-plan.resolved.yaml:/zap/plan/automation-plan.yaml:ro" \
            --add-host=zap:127.0.0.1 \
            --entrypoint bash \
            ghcr.io/zaproxy/zaproxy:stable \
            -c 'zap.sh -cmd -autorun /zap/plan/automation-plan.yaml; rc=$?; echo "===ZAP LOG(S) FOUND ON DISK==="; find /home /zap /tmp /root -iname "zap.log*" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null; exit $rc'
          rc=$?
          set -e
          # The previous attempt to grab the auth-attempt detail from
          # zap.log via a fixed mounted path (zap-home/zap.log) silently
          # found nothing — the find above prints it straight into this
          # job's log instead of guessing the path, so it's always visible.
          # No exitStatus job in the plan, so ZAP uses its own default exit
          # codes: 0 ok, 2 warnings found (expected — don't fail the build
          # just because alerts exist), 1 a real plan/execution error.
          echo "ZAP exit code: $rc"
          if [ "$rc" = "1" ]; then
            echo "::error::ZAP automation plan failed to execute (see log above)"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: zap-full-scan-report
          path: report/
          if-no-files-found: warn
