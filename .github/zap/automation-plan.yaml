# OWASP ZAP Automation Framework plan — authenticated staging scan.
#
# Staging consists of two separate Render origins:
# - Frontend: https://gouvernanceriskcontroltools-staging.onrender.com
# - Backend:  https://gouvernance-risk-control-tools-staging.onrender.com
#
# The workflow resolves these values into a private temporary copy using Ruby's
# YAML parser/serializer. The source plan contains no credentials or real hosts.
# Login is performed in the frontend; the session verification endpoint is on
# the backend. Both origins must be in the same context for ZAP to scan the
# browser-generated API traffic and authenticated API endpoints.
#
# Login flow:
#   Frontend login form -> POST <API>/api/v1/auth/local
#     {"email","password"} -> {"accessToken","tokenType"}
#   Verification: GET <API>/api/v1/users/me
# Protected routes require Authorization: Bearer <accessToken>.
#
# ZAP active scanning is restricted to the dedicated staging environment.
# Never use this plan against production or real customer data.

env:
  contexts:
    - name: grc-tools
      urls:
        - ${ZAP_TARGET_URL}
        - ${ZAP_API_BASE_URL}
      authentication:
        method: "browser"
        parameters:
          loginPageUrl: ${ZAP_TARGET_URL}
          # Capture sanitized diagnostics so failed SPA login attempts can be
          # distinguished from browser/proxy failures in the ZAP auth report.
          diagnostics: true
          loginPageWait: 20
          stepDelay: 2
          browserId: "firefox-headless"
          # Use stable selectors from App.tsx instead of relying on automatic
          # field discovery for the custom React/design-system login form.
          # The USERNAME/PASSWORD steps read the context user's credentials.
          steps:
            - description: "Fill the local QA email field"
              type: "USERNAME"
              cssSelector: "#local-email"
              timeout: 10000
            - description: "Fill the local QA password field"
              type: "PASSWORD"
              cssSelector: "#local-password"
              timeout: 10000
            - description: "Submit the local QA login form"
              type: "CLICK"
              cssSelector: "form.auth-dev button[type='submit']"
              timeout: 10000
        verification:
          method: "poll"
          pollUrl: ${ZAP_API_BASE_URL}/api/v1/users/me
          loggedOutRegex: "Missing bearer token|Invalid or expired token"
          pollFrequency: 20
          pollUnits: "requests"
      sessionManagement:
        # The frontend keeps its token in React state. Browser-driven scanning
        # observes the real login flow; ZAP's header session management replays
        # the Bearer token for direct HTTP requests to protected API paths.
        method: "headers"
        parameters:
          Authorization: "Bearer {%json:accessToken%}"
      users:
        - name: qa
          credentials:
            username: ${ZAP_TEST_EMAIL}
            password: ${ZAP_TEST_PASSWORD}

jobs:
  # Use the Client Spider as the sole frontend crawler. The traditional spider
  # was also probing the backend origin at "/" (which correctly returns 404),
  # producing a plan warning unrelated to the SPA crawl.
  - type: spiderClient
    parameters:
      context: grc-tools
      user: qa
      url: ${ZAP_TARGET_URL}
      # React needs time to hydrate after the Render cold start and after the
      # local-login form submits. Keep the scan bounded, but avoid racing the SPA.
      maxDuration: 15
      maxCrawlDepth: 10
      maxChildren: 150
      browserId: "firefox-headless"
      initialLoadTime: 10
      pageLoadTime: 3
      actionWaitTime: 2
      shutdownTime: 15
      numberOfBrowsers: 1
      logoutAvoidance: true
      scopeCheck: "Flexible"

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan
    parameters:
      context: grc-tools
      user: qa
      maxScanDurationInMins: 30
      threadPerHost: 2
      delayInMs: 250

  # Evidence of what ZAP actually found; the workflow enforces a minimum
  # authenticated API coverage gate before accepting the run.
  - type: export
    parameters:
      context: grc-tools
      type: yaml
      source: sitestree
      fileName: /zap/wrk/report/site-tree.yaml

  - type: export
    parameters:
      context: grc-tools
      type: yaml
      source: clientmap
      fileName: /zap/wrk/report/client-map.yaml

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/report
      reportFile: report_html
      reportTitle: "ZAP Full Scan (authenticated) — GRC Tools"

  - type: report
    parameters:
      template: traditional-md
      reportDir: /zap/wrk/report
      reportFile: report_md
      reportTitle: "ZAP Full Scan (authenticated) — GRC Tools"

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/report
      reportFile: report_json
      reportTitle: "ZAP Full Scan (authenticated) — GRC Tools"
