# OWASP ZAP Automation Framework plan — authenticated full scan.
#
# Why this exists: the unauthenticated full scan (zaproxy/action-full-scan)
# only ever found the static SPA shell (8-9 endpoints, 100% GET) because
# every real page/API call in this app sits behind the local QA login form
# (#local-email / #local-password, rendered at "/" when
# VITE_AUTH_PROVIDER=local — confirmed on staging by inspecting the built
# JS bundle). This plan drives a real headless browser through that form
# so the Ajax spider and active scan can reach the authenticated app.
#
# Login flow (backend/src/api/v1/localAuth.routes.ts):
#   POST /api/v1/auth/local {"email","password"} -> {"accessToken","tokenType"}
# Protected routes require header: Authorization: Bearer <accessToken>
# (backend/src/api/middleware/auth.ts) — on failure they return JSON body
# {"error":"Missing bearer token"} or {"error":"Invalid or expired token"}.
# Verification target: GET /api/v1/users/me (any authenticated route works).
#
# ${ZAP_TARGET_URL} / ${ZAP_TEST_EMAIL} / ${ZAP_TEST_PASSWORD} are substituted
# by the workflow itself (envsubst, "Resolve ZAP automation plan secrets"
# step) before this file is ever handed to ZAP — never hardcode credentials
# here. This is deliberate, not just convention: ZAP's own built-in
# ${envvar} substitution turned out to resolve context.urls and
# authentication.parameters.loginPageUrl correctly but silently failed for
# authentication.verification.pollUrl (left as the literal string
# "${ZAP_TARGET_URL}/api/v1/users/me", which the HTTP client then rejected
# with "incorrect path"). Every verification poll errored as a result, so
# ZAP could never confirm a login had succeeded — that's what was actually
# behind the 42%/80% "authentication failure" aborts, not rate limiting.
# Pre-resolving the whole file ourselves removes ZAP's substitution from the
# loop entirely instead of hunting for every field it does or doesn't cover.

env:
  contexts:
    - name: grc-tools
      urls:
        - ${ZAP_TARGET_URL}
      authentication:
        method: "browser"
        parameters:
          loginPageUrl: ${ZAP_TARGET_URL}
        verification:
          method: "poll"
          pollUrl: ${ZAP_TARGET_URL}/api/v1/users/me
          loggedOutRegex: "\\Q\"error\":\"Missing bearer token\"\\E|\\Q\"error\":\"Invalid or expired token\"\\E"
          # Default poll frequency is every single request, which hammers
          # /api/v1/users/me hard enough during the active scan to trip
          # authAttemptRateLimiter (backend/src/api/middleware/rateLimit.ts:
          # 50 failed requests / 15 min / IP) on its own — that rate limiter
          # is almost certainly what the first authenticated run's "42%
          # authentication failures" abort actually measured.
          pollFrequency: 20
          pollUnits: "requests"
      sessionManagement:
        # The app never persists the token to a cookie/localStorage (it's
        # plain React state) — so raw HTTP replay (spider/active scan) needs
        # the Bearer header re-attached per request from the JSON the login
        # POST returned. Browser-driven steps (spiderAjax) get it for free
        # since they share the same in-page JS state.
        method: "headers"
        parameters:
          Authorization: "Bearer {%json:accessToken%}"
      users:
        - name: qa
          credentials:
            username: ${ZAP_TEST_EMAIL}
            password: ${ZAP_TEST_PASSWORD}

jobs:
  - type: spider
    parameters:
      context: grc-tools
      url: ${ZAP_TARGET_URL}
      maxDuration: 2

  - type: spiderAjax
    parameters:
      context: grc-tools
      user: qa
      url: ${ZAP_TARGET_URL}
      maxDuration: 5
      logoutAvoidance: true
      # Default is one browser per CPU core, each logging in independently
      # from the same runner IP — a likely contributor to the rate-limiter
      # trip above. One browser is slower but keeps login attempts serial.
      numberOfBrowsers: 1

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan
    parameters:
      context: grc-tools
      user: qa
      maxScanDurationInMins: 30
      # Keep request volume/concurrency low enough to stay well under
      # authAttemptRateLimiter's 50-failed-requests/15min/IP budget even
      # if a handful of fuzzed requests legitimately 401.
      threadPerHost: 2
      delayInMs: 250

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/report
      reportFile: report_html
      reportTitle: "ZAP Full Scan (authenticated) — GRC Tools"

  - type: report
    parameters:
      template: traditional-md
      reportDir: /zap/wrk/report
      reportFile: report_md
      reportTitle: "ZAP Full Scan (authenticated) — GRC Tools"

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/report
      reportFile: report_json
      reportTitle: "ZAP Full Scan (authenticated) — GRC Tools"
