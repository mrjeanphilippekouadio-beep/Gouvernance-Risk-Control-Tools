apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: grc-tools-api
  annotations:
    # The API is called by the browser; application authentication remains
    # enforced by the Express bearer-token middleware.
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Keep scaling bounded; tune these values after observing production load.
        autoscaling.knative.dev/maxScale: "10"
    spec:
      # User-managed service identity. Give it only Secret Manager access
      # to DATABASE_URL and the Google Drive API access it actually needs.
      serviceAccountName: grc-tools-runtime@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/grc/grc-backend@IMAGE_DIGEST
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: grc-database-url
                  key: "1"
            - name: GOOGLE_OAUTH_CLIENT_ID
              value: REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID
            - name: CORS_ALLOWED_ORIGINS
              value: https://REPLACE_WITH_FRONTEND_HOST
          startupProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 20
            failureThreshold: 3
